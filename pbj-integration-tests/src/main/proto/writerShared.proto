syntax = "proto3";
package pbj.integ.test.writer.shared;
option java_multiple_files = true;

/**
 * A message the custom source set uses from this one, which is a separate module to it, so its writers there can only
 * write it from objects or pre-encoded bytes.
 */
// <<<pbj.writers = true>>>
message SharedLeaf {
  int32 id = 1;
  string label = 2;
}
