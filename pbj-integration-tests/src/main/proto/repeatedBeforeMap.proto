syntax = "proto3";

package proto;

option java_package = "com.hedera.pbj.test.proto.java";
option java_multiple_files = true;

/** Repeated fields before and between maps: the generated hashCode() must not repeat any field's code. */
message RepeatedBeforeMap {
  repeated int32 values = 1;
  map<string, int32> counts = 2;
  repeated string names = 3;
  map<int64, string> labels = 4;
  int64 id = 5;
}
